{% extends "base.html" %}
{% block content %}
<script>$(function() { $.session.set("ToggleStatusPlot", "NULL"); $.session.set("ToggleStatusWebcam", "NULL"); $.session.set("ToggleStatusraspicam", "NULL"); });</script>
<form action="./update.php" method="POST">
<div id="info_site">
	<h1>{{ _('Install update') }}</h1>
	{% if nextion %}<p>{{ _('A new Update has been found for the NEXTION display.') }}</p><br>{% endif %}
	<p>{{ _('Do you want to install the update?') }}</p>
</div>
<br>
<table align="center" width="80%">
	<tr>
		<td width="20%"></td>
		<td align="center"><input type="submit" class="button_yes" name="{{ confirm }}" value=""><input type="submit" class="button_back" name="back" value=""></td>
		<td width="20%"></td>
	</tr>
</table>
</form>
<br>
{% endblock %}
