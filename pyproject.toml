[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanthermo"
dynamic = ["version"]
description = "WLANThermo: 8-Kanal-WLAN-Grillthermometer auf Basis Raspberry Pi"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.7"
dependencies = [
    "bitstring",
    "nextion>=2.0,<3",  # 3.x enthält einen Fehler im Firmware-Upload
    "psutil",
    "pyinotify",
]

[project.optional-dependencies]
# Auf dem Pi kommen diese per apt (python3-pigpio, python3-rpi.gpio), daher keine Pflicht-Abhängigkeit
pi = ["pigpio", "RPi.GPIO"]

[project.urls]
Homepage = "https://wlanthermo.de/"
Forum = "https://forum.wlanthermo.de/"

[project.scripts]
wlanthermo-comp = "wlanthermo.comp.service:main"
wlanthermo-nextion = "wlanthermo.display.nextion_ui:main"
wlanthermo-lcd204 = "wlanthermo.display.lcd_204:main"
wlanthermo-watchdog = "wlanthermo.watchdog:main"
wlanthermo-pitmaster = "wlanthermo.pitmaster:main"
wlanthermo-hwclock = "wlanthermo.display.hwclock:main"
wlanthermo-nextion-upload = "wlanthermo.display.upload:main"
wlanthermo-updateconfig = "wlanthermo.tools.updateconfig:main"
wlanthermo-maverick = "wlanthermo.sensors.maverick.receiver:main"
wlanthermo-update-checker = "wlanthermo.tools.update_checker:main"

[tool.setuptools.dynamic]
version = {attr = "wlanthermo.__version__"}
