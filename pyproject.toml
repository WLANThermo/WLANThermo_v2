[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanthermo"
dynamic = ["version"]
description = "WLANThermo: 8-Kanal-WLAN-Grillthermometer auf Basis Raspberry Pi"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.7"
dependencies = [
    "bitstring",
    "nextion>=2.0,<3",  # 3.x enthält einen Fehler im Firmware-Upload
    "psutil",
    "pyinotify",
]

[project.optional-dependencies]
# Auf dem Pi kommen diese per apt (python3-pigpio, python3-rpi.gpio), daher keine Pflicht-Abhängigkeit
pi = ["pigpio", "RPi.GPIO"]

[project.urls]
Homepage = "https://wlanthermo.de/"
Forum = "https://forum.wlanthermo.de/"

[project.scripts]
wlanthermo-comp = "wlanthermo.cli:comp"
wlanthermo-nextion = "wlanthermo.cli:nextion"
wlanthermo-lcd204 = "wlanthermo.cli:lcd204"
wlanthermo-watchdog = "wlanthermo.cli:watchdog"
wlanthermo-pitmaster = "wlanthermo.cli:pitmaster"
wlanthermo-hwclock = "wlanthermo.cli:hwclock"
wlanthermo-nextion-upload = "wlanthermo.cli:nextion_upload"
wlanthermo-updateconfig = "wlanthermo.cli:updateconfig"
wlanthermo-maverick = "wlanthermo.cli:maverick"
wlanthermo-update-checker = "wlanthermo.cli:update_checker"

[tool.setuptools.dynamic]
version = {attr = "wlanthermo.__version__"}
