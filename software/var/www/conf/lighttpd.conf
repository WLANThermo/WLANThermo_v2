server.modules = (
	"mod_access",
	"mod_alias",
	"mod_compress",
	"mod_redirect",
	"mod_proxy",
)

server.document-root        = "/var/www"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "www-data"
server.groupname            = "www-data"
server.port                 = 80
server.dir-listing	    = "enable"

index-file.names            = ( "index.html" )
url.access-deny             = ( "~", ".inc" )

compress.cache-dir          = "/var/cache/lighttpd/compress/"
compress.filetype           = ( "application/javascript", "text/css", "text/html", "text/plain" )

# default listening port for IPv6 falls back to the IPv4 port
include_shell "/usr/share/lighttpd/use-ipv6.pl " + server.port
include_shell "/usr/share/lighttpd/create-mime.assign.pl"
include_shell "/usr/share/lighttpd/include-conf-enabled.pl"

# Statische Dateien liefert lighttpd aus /var/www, alles andere das Webinterface
# (wlanthermo-web.service, Flask). Die Seiten behalten ihre Adressen (/index.php, /control/...).
$HTTP["url"] !~ "^/(css|js|images|font|tmp|thermolog|thermoplot|log|conf)/|^/(buzzer\.(mp3|ogg|m4a)|LICENSE\.txt|apple-touch-icon-180x180-precomposed\.png)$" {
  proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8080 )) )
  # Live-Werte (Server-Sent Events auf /events) nicht puffern
  server.stream-response-body = 2
}

$HTTP["host"] =~ "" {
  auth.backend = "htpasswd"
  auth.backend.htpasswd.userfile = "/etc/lighttpd/htpasswd"
  auth.require = (
      "/control"          =>  ("method" => "basic", "realm" => "Login", "require" => "user=wlanthermo"),
      "/conf"             =>  ("method" => "basic", "realm" => "Login", "require" => "user=wlanthermo"),
	  "/log"              =>  ("method" => "basic", "realm" => "Login", "require" => "user=wlanthermo")
  )
}
